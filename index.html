<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Verse · தினம் ஒரு வசனம்</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Serif+Tamil:wght@400;600&display=swap">
<style>
:root{
  --bg:#e9f0f2; --ink:#1d3640; --soft:#5b7580; --card:#f7fafb; --line:#cfdde2;
  --sage:#7ea08c; --gold:#f0cf7a; --accent:#2f6b7a; --accent-ink:#fff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10222a;--ink:#e6eef0;--soft:#97b0b8;--card:#17303a;--line:#27444f;--sage:#8fb59f;--gold:#d9b862;--accent:#8cc3cf;--accent-ink:#0e1f26}
}
:root[data-theme="dark"]{--bg:#10222a;--ink:#e6eef0;--soft:#97b0b8;--card:#17303a;--line:#27444f;--sage:#8fb59f;--gold:#d9b862;--accent:#8cc3cf;--accent-ink:#0e1f26}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);background:
  radial-gradient(60vmax 40vmax at 50% -12vmax,color-mix(in srgb,var(--gold) 45%,transparent),transparent 70%),var(--bg);
  font:19px/1.7 'Newsreader','Noto Serif Tamil','Noto Serif Devanagari',Georgia,serif}
main{max-width:720px;margin:0 auto;padding:40px 20px 80px}
h1{font-weight:500;font-size:clamp(30px,6vw,44px);line-height:1.15;margin:0 0 6px;text-align:center}
.sub{text-align:center;color:var(--soft);margin:0 0 28px}
nav{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--soft);font:inherit;padding:6px 14px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--sage)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
label{display:block;font-size:15px;color:var(--soft)}
input,select{width:100%;margin-top:4px;padding:10px 12px;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
button.go,button.sm{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--accent)}
button.go{background:var(--accent);color:var(--accent-ink);padding:11px 28px;font-size:18px}
button.sm{background:none;color:var(--accent);padding:3px 14px;font-size:15px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.center{text-align:center}
#verseBox{margin-top:28px;text-align:center}
#verseBox.show{animation:rise 1.4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#verseBox.show{animation:none}}
.greet{color:var(--soft);margin:0 0 10px}
.verse{font-size:clamp(24px,4.6vw,32px);line-height:1.6;margin:0 0 10px;font-style:italic}
.ref{color:var(--soft);margin:0 0 16px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.explain{margin:16px auto 0;max-width:600px;text-align:left;border-left:3px solid var(--sage);padding:2px 0 2px 14px;color:var(--ink)}
.explain:empty{display:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
#chapter{margin-top:8px}
.v{padding:10px 0;border-top:1px solid var(--line)}
.v b{color:var(--sage);font-weight:600;margin-right:8px}
.v .actions{justify-content:flex-start;margin-top:6px}
.note{font-size:15px;color:var(--soft);text-align:center;margin-top:14px;min-height:1.4em}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Daily Verse<br>தினம் ஒரு வசனம்</h1>
  <p class="sub">A quiet moment with God’s word.</p>

  <nav role="tablist">
    <button role="tab" id="t-daily" aria-selected="true">Today’s verse</button>
    <button role="tab" id="t-bible" aria-selected="false">Read the Bible</button>
  </nav>

  <section class="panel">
    <!-- Shared settings -->
    <div class="row">
      <label>Bible language<select id="lang"></select></label>
      <label>Version<select id="version"></select></label>
      <label>Explain in<select id="expLang">
        <option value="Tamil">தமிழ் (modern, simple)</option>
        <option value="English">English</option>
        <option value="Hindi">हिन्दी</option>
        <option value="Telugu">తెలుగు</option>
        <option value="Malayalam">മലയാളം</option>
      </select></label>
    </div>

    <!-- DAILY -->
    <div id="daily">
      <div class="row">
        <label>Your name<input id="name" autocomplete="given-name" placeholder="Enter your name"></label>
        <label>Date<input id="date" type="date"></label>
      </div>
      <div class="center"><button class="go" id="getVerse">Show my verse</button></div>
      <div id="verseBox" hidden>
        <p class="greet" id="greet"></p>
        <p class="verse" id="vText"></p>
        <p class="ref" id="vRef"></p>
        <div class="actions">
          <button class="sm" id="vRead">Read aloud</button>
          <button class="sm" id="vExplain">Explain</button>
          <button class="sm" id="vStop">Stop</button>
        </div>
        <div class="explain" id="vExp"></div>
      </div>
    </div>

    <!-- BIBLE -->
    <div id="bible" hidden>
      <div class="row">
        <label>Book<select id="book"></select></label>
        <label>Chapter<input id="chap" type="number" min="1" value="1"></label>
      </div>
      <div class="tools">
        <button class="go" id="loadCh">Open</button>
        <button class="sm" id="prev">Previous</button>
        <button class="sm" id="next">Next</button>
        <button class="sm" id="readCh">Read chapter</button>
        <button class="sm" id="stopCh">Stop</button>
      </div>
      <div id="chapter"></div>
    </div>

    <p class="note" id="note" role="status"></p>
  </section>
</main>

<script>
/* ============ SETTINGS ============ */
const API = 'https://api.getbible.net/v2';
// Your backend (see worker code at the bottom). Leave '' until deployed.
const EXPLAIN_URL = '';   // e.g. https://your-worker.workers.dev/explain
const TTS_URL     = '';   // e.g. https://your-worker.workers.dev/tts  (custom voice, "Jesus Tyson")

/* Peaceful verses: [book number, chapter, verse] */
const VERSES = [[43,14,27],[19,23,1],[40,11,28],[50,4,7],[23,41,10],[19,46,10],[43,16,33],[6,1,9],
[20,3,5],[45,8,28],[24,29,11],[40,6,34],[60,5,7],[19,27,1],[23,26,3],[4,6,24],[36,3,17],[25,3,22],
[19,34,18],[43,3,16],[45,15,13],[51,3,15],[55,1,7],[19,91,1],[19,37,4],[40,5,9],[43,10,10],[19,118,24],
[19,121,2],[23,40,31],[43,8,12]];
const SPEECH = {ta:'ta-IN',hi:'hi-IN',en:'en-US',te:'te-IN',ml:'ml-IN',kn:'kn-IN'};
const EXP_CODE = {Tamil:'ta',English:'en',Hindi:'hi',Telugu:'te',Malayalam:'ml'};

const $ = id => document.getElementById(id);
const note = t => $('note').textContent = t || '';
let translations = {}, books = [], current = {text:'', ref:''}, audio = null, stopFlag = false;

/* ============ HELPERS ============ */
async function getJSON(u){ const r = await fetch(u); if(!r.ok) throw new Error(r.status); return r.json(); }
function hash(s){ let h = 2166136261; for(const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h,16777619); } return h >>> 0; }
const cleanText = s => (s||'').replace(/<[^>]+>/g,'').trim();
const langCode = () => (translations[$('version').value]||{}).lang || 'en';

/* ============ VOICE ============ */
function stopVoice(){
  stopFlag = true; speechSynthesis.cancel();
  if(audio){ audio.pause(); audio = null; }
}
function chunks(t){ return (t.match(/[^.!?।]+[.!?।]*\s*/g)||[t]).map(x=>x.trim()).filter(Boolean); }
function speakChunks(parts, lang){
  return new Promise(resolve=>{
    const code = SPEECH[lang] || lang, voices = speechSynthesis.getVoices();
    const voice = voices.find(v=>v.lang.replace('_','-').toLowerCase().startsWith(code.slice(0,2)));
    if(!voice) note('This device has no '+code+' voice. Install it in phone Settings → Text-to-speech, or set TTS_URL for a custom voice.');
    let i = 0;
    const next = () => {
      if(stopFlag || i >= parts.length) return resolve();
      const u = new SpeechSynthesisUtterance(parts[i++]);
      u.lang = code; if(voice) u.voice = voice; u.rate = .9;
      u.onend = next; u.onerror = next;
      speechSynthesis.speak(u);
    };
    next();
  });
}
async function say(text, lang){
  stopVoice(); stopFlag = false; note('');
  if(TTS_URL){
    try{
      const r = await fetch(TTS_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,lang})});
      if(!r.ok) throw 0;
      audio = new Audio(URL.createObjectURL(await r.blob()));
      await audio.play(); return new Promise(res => audio.onended = res);
    }catch(e){ note('Custom voice failed, using device voice.'); }
  }
  return speakChunks(chunks(text), lang);
}

/* ============ EXPLAIN ============ */
async function explain(text, ref, out){
  if(!EXPLAIN_URL){ out.textContent = 'Explain feature needs EXPLAIN_URL (backend). See the worker code at the bottom of this file.'; return; }
  out.textContent = 'Thinking…'; note('');
  try{
    const language = $('expLang').value;
    const r = await fetch(EXPLAIN_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({verse:text, reference:ref, language})});
    if(!r.ok) throw 0;
    const {text:ex} = await r.json();
    out.textContent = ex;
    await say(ex, EXP_CODE[language]);   // voice plays right after explanation
  }catch(e){ out.textContent = 'Could not get the explanation. Try again.'; }
}

/* ============ BIBLE DATA ============ */
async function loadTranslations(){
  translations = await getJSON(API+'/translations.json');
  const langs = [...new Set(Object.values(translations).map(t=>t.language))].sort();
  $('lang').innerHTML = langs.map(l=>`<option>${l}</option>`).join('');
  $('lang').value = langs.includes('Tamil') ? 'Tamil' : 'English';
  fillVersions();
}
function fillVersions(){
  const list = Object.entries(translations).filter(([,t])=>t.language===$('lang').value);
  $('version').innerHTML = list.map(([k,t])=>`<option value="${k}">${t.translation}</option>`).join('');
  loadBooks();
}
async function loadBooks(){
  try{
    const b = await getJSON(`${API}/${$('version').value}/books.json`);
    books = (Array.isArray(b) ? b : Object.values(b)).sort((x,y)=>x.nr-y.nr);
    $('book').innerHTML = books.map(x=>`<option value="${x.nr}">${x.name}</option>`).join('');
  }catch(e){ note('Could not load the book list.'); }
}
async function getChapter(book, ch){
  return getJSON(`${API}/${$('version').value}/${book}/${ch}.json`);
}

/* ============ DAILY VERSE ============ */
$('date').valueAsDate = new Date();
$('getVerse').onclick = async () => {
  const name = $('name').value.trim(), date = $('date').value;
  if(!name || !date){ note('Please enter your name and pick a date.'); return; }
  note('Finding your verse…'); stopVoice();
  const [b,c,v] = VERSES[hash(name.toLowerCase()+date) % VERSES.length];
  try{
    const d = await getChapter(b,c);
    const verse = d.verses.find(x=>x.verse===v) || d.verses[0];
    current = {text: cleanText(verse.text), ref: `${d.name||d.book_name+' '+c}:${verse.verse}`};
    $('greet').textContent = `${name}, this is for you today`;
    $('vText').textContent = current.text;
    $('vRef').textContent = current.ref;
    $('vExp').textContent = '';
    const box = $('verseBox'); box.hidden = false; box.classList.remove('show'); void box.offsetWidth; box.classList.add('show');
    note('');
  }catch(e){ note('Could not load this version. Pick another version and try again.'); }
};
$('vRead').onclick = () => say(current.text, langCode());
$('vExplain').onclick = () => explain(current.text, current.ref, $('vExp'));
$('vStop').onclick = stopVoice;

/* ============ READ THE BIBLE ============ */
async function openChapter(){
  const b = +$('book').value, c = +$('chap').value || 1; stopVoice(); note('Loading…');
  try{
    const d = await getChapter(b,c);
    $('chapter').innerHTML = '';
    d.verses.forEach(v=>{
      const el = document.createElement('div'); el.className = 'v';
      el.innerHTML = `<b>${v.verse}</b><span></span><div class="actions"><button class="sm r">Read</button><button class="sm e">Explain</button></div><div class="explain"></div>`;
      const t = cleanText(v.text), ref = `${d.name||d.book_name+' '+c}:${v.verse}`;
      el.querySelector('span').textContent = t;
      el.querySelector('.r').onclick = () => say(t, langCode());
      el.querySelector('.e').onclick = () => explain(t, ref, el.querySelector('.explain'));
      el.dataset.t = t; $('chapter').append(el);
    });
    note(''); return true;
  }catch(e){ note('That chapter was not found.'); return false; }
}
$('loadCh').onclick = openChapter;
$('prev').onclick = () => { if(+$('chap').value>1){ $('chap').value--; openChapter(); } };
$('next').onclick = async () => {
  $('chap').value++;
  if(!(await openChapter())){
    const i = $('book').selectedIndex;
    if(i < $('book').options.length-1){ $('book').selectedIndex = i+1; $('chap').value = 1; openChapter(); }
  }
};
$('readCh').onclick = async () => {
  stopVoice(); stopFlag = false;
  for(const el of document.querySelectorAll('#chapter .v')){
    if(stopFlag) break; await speakChunks(chunks(el.dataset.t), SPEECH[langCode()]||langCode());
  }
};
$('stopCh').onclick = stopVoice;

/* ============ TABS & INIT ============ */
function tab(daily){
  $('daily').hidden = !daily; $('bible').hidden = daily;
  $('t-daily').setAttribute('aria-selected',daily); $('t-bible').setAttribute('aria-selected',!daily);
}
$('t-daily').onclick = () => tab(true);
$('t-bible').onclick = () => tab(false);
$('lang').onchange = fillVersions;
$('version').onchange = loadBooks;
speechSynthesis.onvoiceschanged = () => {};
loadTranslations().catch(()=>note('Could not reach the Bible service. Check your internet.'));

/* =====================================================================
   BACKEND (Cloudflare Worker) — keeps your API keys secret.
   Deploy this as a separate worker, then paste its URLs in EXPLAIN_URL / TTS_URL.
   Secrets: ANTHROPIC_KEY, ELEVEN_KEY, VOICE_ID (the voice you have permission to use).

   const cors = {'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type'};
   export default { async fetch(req, env){
     if(req.method==='OPTIONS') return new Response(null,{headers:cors});
     const {pathname} = new URL(req.url), b = await req.json();
     if(pathname==='/explain'){
       const r = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
         headers:{'x-api-key':env.ANTHROPIC_KEY,'anthropic-version':'2023-06-01','content-type':'application/json'},
         body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:500,
           messages:[{role:'user',content:`Explain this Bible verse (${b.reference}) in very simple, modern spoken ${b.language}, as if talking to a friend. Avoid old or literary words. 3-4 short sentences, plain text only.\n\n${b.verse}`}]})});
       const j = await r.json();
       return new Response(JSON.stringify({text:j.content[0].text}),{headers:{...cors,'content-type':'application/json'}});
     }
     if(pathname==='/tts'){
       const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${env.VOICE_ID}`,{method:'POST',
         headers:{'xi-api-key':env.ELEVEN_KEY,'content-type':'application/json'},
         body:JSON.stringify({text:b.text,model_id:'eleven_multilingual_v2'})});
       return new Response(r.body,{headers:{...cors,'content-type':'audio/mpeg'}});
     }
     return new Response('Not found',{status:404});
   }}
   ===================================================================== */
</script>
</body>
</html>
